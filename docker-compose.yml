# Hermes Agent — derived GUI image (FROM nousresearch/hermes-agent) + ./data persistence
#
# Build:
#   docker compose build gateway
#
# First-time setup (interactive wizard):
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose --profile setup run --rm setup
#
# Start gateway + desktop GUI:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d --build
#
# Logs:
#   docker compose logs -f gateway
#
# noVNC (after container is up):
#   http://localhost:6080/vnc_lite.html

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gui
    image: hermes-agent-gui:local
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    ports:
      - "${HERMES_GATEWAY_PORT:-8642}:8642"
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
      # Container side follows VNC_PORT / NOVNC_WS_PORT so changing them stays reachable.
      # GUI ports bind to loopback only; set HERMES_GUI_BIND_ADDRESS=0.0.0.0 to expose them.
      # websockify serves both the noVNC page and the WebSocket on one port.
      - "${HERMES_GUI_BIND_ADDRESS:-127.0.0.1}:${HERMES_VNC_PORT:-5901}:${VNC_PORT:-5901}"
      - "${HERMES_GUI_BIND_ADDRESS:-127.0.0.1}:${HERMES_NOVNC_PORT:-6080}:${NOVNC_WS_PORT:-6080}"
    volumes:
      - ./data:/opt/data
    environment:
      - TZ=${TZ:-Asia/Taipei}
      # The image's own hermes user is UID 10000, which leaves ./data unwritable
      # by a typical Linux/WSL host user; the entrypoint remaps it from these.
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      - DISPLAY=${VNC_DISPLAY:-:1}
      # cua-driver needs the X11 auth cookie to reach the VNC display; without it
      # screen capture and input injection fail with "Authorization required".
      - XAUTHORITY=/opt/data/.Xauthority
      - AGENT_BROWSER_EXECUTABLE_PATH=/usr/local/bin/google-chrome
      # Read by Hermes' bundled searxng web-search provider. Resolves over the
      # compose network, so it does not depend on the published port.
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      # Vision model for images and computer_use screenshots. Any OpenAI-compatible
      # endpoint — swap providers by editing .env alone. Empty values fall back to
      # Hermes' own provider auto-selection.
      - AUXILIARY_VISION_BASE_URL=${AUXILIARY_VISION_BASE_URL:-}
      - AUXILIARY_VISION_MODEL=${AUXILIARY_VISION_MODEL:-}
      - AUXILIARY_VISION_API_KEY=${AUXILIARY_VISION_API_KEY:-}
      - AUXILIARY_VISION_REASONING_EFFORT=${AUXILIARY_VISION_REASONING_EFFORT:-}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - VNC_DISPLAY=${VNC_DISPLAY:-:1}
      - VNC_PORT=${VNC_PORT:-5901}
      - VNC_GEOMETRY=${VNC_GEOMETRY:-1920x1080}
      - NOVNC_WS_PORT=${NOVNC_WS_PORT:-6080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    shm_size: "2g"
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-8G}
          cpus: "${HERMES_CPU_LIMIT:-4.0}"

  # Self-hosted metasearch engine used as Hermes' web_search backend, so search
  # needs no third-party API key. The agent reaches it at http://searxng:8080 over
  # the compose network; the published port is only for opening the UI yourself.
  searxng:
    image: searxng/searxng:latest
    container_name: hermes-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HERMES_SEARXNG_PORT:-18080}:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    environment:
      - TZ=${TZ:-Asia/Taipei}
      # SearXNG exits on startup while secret_key is the upstream default.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-hermes-searxng-local-only}
      - SEARXNG_BASE_URL=http://localhost:${HERMES_SEARXNG_PORT:-18080}/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  setup:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-setup
    profiles: [setup]
    stdin_open: true
    tty: true
    command: ["setup"]
    volumes:
      - ./data:/opt/data
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  searxng-cache:
